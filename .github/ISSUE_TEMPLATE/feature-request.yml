name: 功能建议
description: 提议符合本地优先和人工复核原则的新能力
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述具体工作流，不要提交包含私人内容的真实文件或链接。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 说明输入、用户操作、输出和失败时应如何恢复。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方式
  - type: checkboxes
    id: constraints
    attributes:
      label: 项目约束
      options:
        - label: 该建议可以保持 Web-only 的 Vue + Python/FastAPI 交付方式。
          required: true
        - label: 该建议不会默认上传用户文件，也不会绕过预览和人工确认。
          required: true
        - label: 我没有在本 Issue 中提交私人文件、凭据或有效分享链接。
          required: true
