version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - maintenance
    commit-message:
      prefix: deps(python)
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: pytest
        versions:
          - ">=9"
      - dependency-name: pytest-cov
        versions:
          - ">=7"
      - dependency-name: transformers
        versions:
          - ">=4.50"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - maintenance
    commit-message:
      prefix: deps(frontend)
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: pdfjs-dist
        versions:
          - "5.7.284"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - maintenance
    commit-message:
      prefix: deps(actions)
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
