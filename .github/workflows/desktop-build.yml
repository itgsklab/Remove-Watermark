name: Desktop build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: watermark-remover-macos-arm64
            archive: dist/watermark-remover-macos-arm64.tar.gz
          - os: windows-2022
            artifact: watermark-remover-windows-x64
            archive: dist/watermark-remover-windows-amd64.zip
          - os: ubuntu-24.04
            artifact: watermark-remover-linux-x64
            archive: dist/watermark-remover-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install backend packaging dependencies
        run: python -m pip install -c packaging/constraints.txt -e "./backend[packaging]"
      - name: Build desktop bundle
        run: python packaging/build_desktop.py --skip-npm-ci
      - name: Verify bundled API, frontend and shutdown
        run: python packaging/verify_desktop.py
      - name: Archive bundle with executable permissions
        run: python packaging/archive_desktop.py
      - name: Upload desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14
