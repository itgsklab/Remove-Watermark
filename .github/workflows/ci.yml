name: Continuous integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            packaging/constraints.txt
      - name: Install pinned development dependencies
        run: python -m pip install --constraint packaging/constraints.txt --editable './backend[dev]'
      - name: Lint Python sources
        run: python -m ruff check backend
      - name: Run backend tests with coverage
        working-directory: backend
        run: python -m pytest --cov=wmrm

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check Vue sources
        working-directory: frontend
        run: npm run typecheck
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Reject known high-severity frontend vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high
