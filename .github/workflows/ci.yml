name: Continuous integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify immutable GitHub Action references
        run: python packaging/verify_workflow_action_pins.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            packaging/constraints.txt
      - name: Install pinned development dependencies
        run: python -m pip install --constraint packaging/constraints.txt --editable './backend[dev]'
      - name: Lint Python sources
        run: >-
          python -m ruff check backend
          packaging/generate_openapi_contract.py
          packaging/tests/test_generate_openapi_contract.py
      - name: Verify frozen OpenAPI v1 contract
        run: python packaging/generate_openapi_contract.py --check
      - name: Test OpenAPI contract tooling
        run: python -m pytest packaging/tests/test_generate_openapi_contract.py
      - name: Run full backend test suite
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check Vue sources
        working-directory: frontend
        run: npm run typecheck
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Reject known high-severity frontend vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            packaging/constraints.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create isolated Python environment
        run: python -m venv backend/.venv
      - name: Install pinned Web backend
        run: backend/.venv/bin/pip install --constraint packaging/constraints.txt --editable backend
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run DOCX, PDF and image browser workflows
        working-directory: frontend
        run: npm run e2e
      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-e2e-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
