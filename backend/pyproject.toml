[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "wmrm"
version = "0.1.0rc1"
description = "Local-first watermark processing service"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "opencv-python-headless>=4.14,<6",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "pillow>=12.3,<13",
  "pymupdf>=1.26,<2",
  "pypdf>=5,<7",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
packaging = [
  "pyinstaller==6.22.3",
  "pyinstaller-hooks-contrib==2026.8",
]

[project.scripts]
wmrm = "wmrm.cli:main"
wmrm-api = "wmrm.api.app:main"
wmrm-desktop = "wmrm.desktop:main"
wmrm-image-benchmark = "wmrm.benchmarks.image_quality:main"
wmrm-mobile-watermark-benchmark = "wmrm.benchmarks.mobile_watermark:main"
wmrm-mobile-selection-corpus = "wmrm.benchmarks.mobile_selection_corpus:main"
wmrm-complexity-calibration = "wmrm.benchmarks.complexity_calibration:main"
wmrm-codecv-corpus = "wmrm.benchmarks.codecv_corpus:main"
wmrm-codecv-probe = "wmrm.benchmarks.codecv_probe:main"
wmrm-pdf-redaction-probe = "wmrm.benchmarks.pdf_redaction_probe:main"
wmrm-pdf-ocr-probe = "wmrm.benchmarks.pdf_ocr_probe:main"
wmrm-pdf-redaction-corpus = "wmrm.benchmarks.pdf_redaction_corpus:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wmrm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
